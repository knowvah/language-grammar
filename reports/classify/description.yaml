exclusions:
  CommandTogether: >-
    modeled by the head entries RootTogether (main, desc_together: push desc_together) and
    GroupTogether (desc_group: push desc_group); the generated rule is removed because a
    Together leaves the current group unchanged (net/atmp/CucaDiagram.java:339-342), so
    its push target depends on the state.
  CommandEndPackage: >-
    modeled by the head entries RootEnd (main: set desc_orphan) and GroupEnd
    (desc_together, desc_group: pop); in desc_orphan GroupStackEmpty rejects `}`
    (command/CommandEndPackage.java:67-71). The generated rule is removed so that `}`
    has one derivation per state.
