# Classifications for the `mindmap-wbs` family (T26). Upstream pin 97a5992; `cite` paths
# are full paths under src/main/java/.
# FR is 0 on every corpus (vega 5 blocks, plantuml-ts none, pdiff 348). The seven false
# accepts (FA) are all pdiff tree-structure errors: the level of an item is computed
# from the previous items (root, multiplier, last level) and from leading blanks of the
# untrimmed line (getSmartLevel; the item commands use SingleLineCommand2 doTrim=false).
# ` * x` is level 1 under `* root` (accepted, pdiff input/WBS-monoline-def-0.puml#1)
# while `* x` is a second root, so a check needs the root's marker run and the last
# level from earlier lines (one context per reachable level); the family models do not
# carry that state. Pinned by tests/fixtures/mindmap-wbs/gap.
# Messages were read with `java -jar <stock jar> -syntax`.
# Lark (scratch build of the final model): vega `--lark all` 5/5 and pdiff `--lark all`
# 348/348 agree with the interpreter, 0 timeouts; the plantuml-ts slice is empty.
# The pdiff slice also lists 7 informational raw-mode FRs (not gating). All come from
# preprocessing that raw mode does not reproduce: a line ending in `\` joined with the
# next (input/link-URL-tooltip.puml#0-2, ledama, xasinu, zeneno) and a `!$foo = {`
# JSON assignment spanning several lines (kijaru). The L2 verdicts agree.
cases:
