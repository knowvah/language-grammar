# relative to src/main/java/net/sourceforge/plantuml/ unless they start with net/atmp/.
# FR is 0 on every corpus. The four false accepts (FA) are the same blocks in
# plantuml-ts and pdiff: link endpoints that fail name resolution in ParserPass TWO,
# after every state of the block exists. They depend on which group owns a state,
# which the model cannot know (tests/fixtures/state/gap).
