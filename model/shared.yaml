      - {literal: PaleVioletRed, ci: true, scope: support.constant.color}
      - {literal: PapayaWhip, ci: true, scope: support.constant.color}
      - {literal: PeachPuff, ci: true, scope: support.constant.color}
      - {literal: Peru, ci: true, scope: support.constant.color}
      - {literal: Pink, ci: true, scope: support.constant.color}
