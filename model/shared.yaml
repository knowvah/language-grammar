# Shared fragments (layer L3, decision D3): hand-written, scoped refinements of
# fragments that the generated models repeat. Upstream pin 97a5992.
#
# Contract: every refinement keeps the generated regex as its acceptance definition.
# Its parts accept exactly the language of the generated Part (checked by
# tests/layers/test_shared.py on committed samples and on 50 corpus lines each), and
# every leaf is `ci: true` because upstream compiles these regexes through Pattern2
# with CASE_INSENSITIVE (regex/Pattern2.java:114). `[\s\_]` is the expanded `%s`
# macro, i.e. [\s ] (regex/Pattern2.java:57); `["“”]` is `%g`
# (regex/Pattern2.java:59).
#
# Refinement map (structured variable -> generated Part it refines):
#   COLOR_SPEC        refines gen-shared COLOR (also identical to inline COLOR2 leaves)
#   COLOR_GRADIENT    refines inline `#\w+[-\\|/]?\w+` (gen-activity-diagram BACKCOLOR)
#   COLOR_REF         refines inline `#\w+` (gen-sequence-diagram COLOR, gen-wire-diagram)
#   TAG_LIST          refines gen-shared TAGS (= TAGS1, TAGS2)
#   URL_LINK          refines gen-shared URL
#   VISIBILITY_LIST   refines gen-shared VISIBILITY
#   VISIBILITY_CHAR   refines inline `[-#+~]` (gen-class-diagram VISIBILITY)
#   ARROW_STYLE_SPEC  refines gen-shared ARROW_STYLE (= ARROW_STYLE1, ARROW_STYLE2)
#   ARROW_STYLE_MULTI refines inline ARROW_STYLE1 with `;` groups (gen-description-diagram)
#   STEREOTYPE_SPEC   refines inline `\<\<.+?\>\>` (STEREO/STEREOTYPE in 8 diagram models)
#   STEREOTYPE_GROUP  refines inline STEREOGROUP (gen-activity-diagram3, gen-state-diagram)
#   ARROW_HEAD_LEFT   refines inline ARROW_HEAD1 (gen-class-diagram)
#   ARROW_HEAD_RIGHT  refines inline ARROW_HEAD2 (gen-class-diagram)
#   ARROW_BODY_LINE   refines inline ARROW_BODY1 `[-=.]+` (gen-class-diagram)
#
# Equivalence technique: a generated `\w+` is replaced by COLOR_WORD, an ordered
# alternation whose earlier branches (special, named, hex colors) only match a whole
# word (`(?!\w)`) and whose last branch is `\w+` itself. Earlier branches can only
# produce the end the greedy `\w+` tries first, so leftmost-first matching is
# unchanged; they exist to give named and hex colors their own scopes.
schema_version: 1
id: shared
layer: shared
variables:
  # --- whitespace -------------------------------------------------------------
  SPACE_ANY: {regex: "[\\s\_]*", ci: true}
  SPACE_SOME: {regex: "[\\s\_]+", ci: true}
  SPACE_ONE: {regex: "[\\s\_]", ci: true}

  # --- colors -----------------------------------------------------------------
  # Parsing: klimt/color/HColorSet.java:78-120 (special names :82-86, gradient
  # separators `-\|/` :109-117), hex digits :122-157 (1, 3, 6 or 8 digits), named
  # colors klimt/color/ColorTrieNode.java:55-209 (case-insensitive lookup :212-223).
  COLOR_HASH: {literal: '#', ci: true, scope: punctuation.definition.color}
  COLOR_SPECIAL:
    seq:
    - alt:
      - {literal: transparent, ci: true, scope: support.constant.color}
      - {literal: background, ci: true, scope: support.constant.color}
      - {literal: automatic, ci: true, scope: support.constant.color}
    - {regex: '(?!\w)', ci: true}
  # Upstream's named color table, in registration order (ColorTrieNode.java:55-209).
  COLOR_NAME:
    seq:
    - alt:
      - {literal: AliceBlue, ci: true, scope: support.constant.color}
      - {literal: AntiqueWhite, ci: true, scope: support.constant.color}
      - {literal: Aqua, ci: true, scope: support.constant.color}
      - {literal: Aquamarine, ci: true, scope: support.constant.color}
