      - {literal: LightCyan, ci: true, scope: support.constant.color}
      - {literal: LightGoldenRodYellow, ci: true, scope: support.constant.color}
      - {literal: LightGray, ci: true, scope: support.constant.color}
      - {literal: LightGrey, ci: true, scope: support.constant.color}
      - {literal: LightGreen, ci: true, scope: support.constant.color}
      - {literal: LightPink, ci: true, scope: support.constant.color}
