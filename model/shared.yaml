      - {literal: PowderBlue, ci: true, scope: support.constant.color}
      - {literal: Purple, ci: true, scope: support.constant.color}
      - {literal: Red, ci: true, scope: support.constant.color}
      - {literal: RosyBrown, ci: true, scope: support.constant.color}
      - {literal: RoyalBlue, ci: true, scope: support.constant.color}
      - {literal: SaddleBrown, ci: true, scope: support.constant.color}
      - {literal: Salmon, ci: true, scope: support.constant.color}
      - {literal: SandyBrown, ci: true, scope: support.constant.color}
      - {literal: SeaGreen, ci: true, scope: support.constant.color}
      - {literal: SeaShell, ci: true, scope: support.constant.color}
      - {literal: Sienna, ci: true, scope: support.constant.color}
      - {literal: Silver, ci: true, scope: support.constant.color}
      - {literal: SkyBlue, ci: true, scope: support.constant.color}
      - {literal: SlateBlue, ci: true, scope: support.constant.color}
      - {literal: SlateGray, ci: true, scope: support.constant.color}
      - {literal: SlateGrey, ci: true, scope: support.constant.color}
      - {literal: Snow, ci: true, scope: support.constant.color}
      - {literal: SpringGreen, ci: true, scope: support.constant.color}
      - {literal: SteelBlue, ci: true, scope: support.constant.color}
      - {literal: Tan, ci: true, scope: support.constant.color}
      - {literal: Teal, ci: true, scope: support.constant.color}
      - {literal: Thistle, ci: true, scope: support.constant.color}
      - {literal: Tomato, ci: true, scope: support.constant.color}
      - {literal: Turquoise, ci: true, scope: support.constant.color}
      - {literal: Violet, ci: true, scope: support.constant.color}
      - {literal: Wheat, ci: true, scope: support.constant.color}
      - {literal: White, ci: true, scope: support.constant.color}
      - {literal: WhiteSmoke, ci: true, scope: support.constant.color}
      - {literal: Yellow, ci: true, scope: support.constant.color}
      - {literal: YellowGreen, ci: true, scope: support.constant.color}
      - {literal: BUSINESS, ci: true, scope: support.constant.color}
      - {literal: APPLICATION, ci: true, scope: support.constant.color}
      - {literal: MOTIVATION, ci: true, scope: support.constant.color}
      - {literal: STRATEGY, ci: true, scope: support.constant.color}
      - {literal: TECHNOLOGY, ci: true, scope: support.constant.color}
      - {literal: PHYSICAL, ci: true, scope: support.constant.color}
      - {literal: IMPLEMENTATION, ci: true, scope: support.constant.color}
    - {regex: '(?!\w)', ci: true}
  COLOR_HEX: {regex: '(?:[0-9a-f]{8}|[0-9a-f]{6}|[0-9a-f]{3})(?!\w)', ci: true, scope: constant.other.color.rgb-value}
  COLOR_HEX_GRAY: {regex: '[0-9a-f](?!\w)', ci: true, scope: constant.other.color.rgb-value}
  # Same language and leftmost-first behaviour as `\w+`.
  COLOR_WORD:
    alt:
    - {ref: COLOR_SPECIAL}
    - {ref: COLOR_NAME}
    - {ref: COLOR_HEX}
    - {ref: COLOR_HEX_GRAY}
    - {regex: '\w+', ci: true, scope: constant.other.color}
  # Same as `\w\w+` (a color word of at least two characters).
  COLOR_VALUE:
    alt:
    - {ref: COLOR_SPECIAL}
    - {ref: COLOR_NAME}
    - {ref: COLOR_HEX}
    - {regex: '\w\w+', ci: true, scope: constant.other.color}
  COLOR_GRADIENT_SEP: {regex: '[-\\|/]', ci: true, scope: punctuation.separator.gradient}
  # `\w+[-\\|/]?\w+`: a gradient `a<sep>b` or a single color of two or more chars.
  COLOR_BODY:
    alt:
    - seq: [{ref: COLOR_WORD}, {ref: COLOR_GRADIENT_SEP}, {ref: COLOR_WORD}]
    - {ref: COLOR_VALUE}
  COLOR_GRADIENT:
    seq: [{ref: COLOR_HASH}, {ref: COLOR_BODY}]
  COLOR_REF:
    seq: [{ref: COLOR_HASH}, {ref: COLOR_WORD}]
  COLOR_TERMINATOR: {literal: ;, ci: true, scope: punctuation.terminator.color}
  # Colors.java style keys `#back:red;line:blue;line.bold;text:green`.
  COLOR_PROPERTY:
    alt:
    - {literal: text, ci: true, scope: support.type.property-name}
    - {literal: back, ci: true, scope: support.type.property-name}
    - {literal: header, ci: true, scope: support.type.property-name}
    - {literal: line, ci: true, scope: support.type.property-name}
    - {literal: line.dashed, ci: true, scope: support.type.property-name}
    - {literal: line.dotted, ci: true, scope: support.type.property-name}
    - {literal: line.bold, ci: true, scope: support.type.property-name}
    - {literal: shadowing, ci: true, scope: support.type.property-name}
  COLOR_SPEC:
    opt:
      alt:
      - seq:
        - {ref: COLOR_HASH}
        - opt:
            seq: [{ref: COLOR_BODY}, {ref: COLOR_TERMINATOR}]
        - plus:
            seq:
            - {ref: COLOR_PROPERTY}
            - opt:
                seq:
                - {literal: ':', ci: true, scope: punctuation.separator.key-value}
                - {ref: COLOR_BODY}
            - alt:
              - {ref: COLOR_TERMINATOR}
              - {regex: '(?![\w;:.])', ci: true}
      - {ref: COLOR_GRADIENT}

  # --- tags `$tag` (stereo/Stereotag.java) -----------------------------------------
  TAG_ITEM:
    seq:
    - {literal: $, ci: true, scope: punctuation.definition.tag}
    - {regex: "[^\\s\_{}\"“”<>$]+", ci: true, scope: entity.name.tag}
  TAG_LIST:
    opt:
      seq:
      - {ref: TAG_ITEM}
      - star:
          seq: [{ref: SPACE_SOME}, {ref: TAG_ITEM}]

  # --- URLs `[[target{tooltip} label]]` (url/UrlBuilder.java) -----------------------
  URL_OPEN: {literal: '[[', ci: true, scope: punctuation.definition.link.begin}
  URL_CLOSE: {literal: ']]', ci: true, scope: punctuation.definition.link.end}
  URL_QUOTE_OPEN: {regex: "[\"“”]", ci: true, scope: punctuation.definition.string.begin}
  URL_QUOTE_CLOSE: {regex: "[\"“”]", ci: true, scope: punctuation.definition.string.end}
  URL_TIP_OPEN: {literal: '{', ci: true, scope: punctuation.definition.tooltip.begin}
  URL_TIP_CLOSE: {literal: '}', ci: true, scope: punctuation.definition.tooltip.end}
  URL_TOOLTIP:
    seq:
    - {ref: SPACE_ANY}
    - {ref: URL_TIP_OPEN}
    - {regex: '[^{}]*', ci: true, scope: string.quoted.other.tooltip}
    - {ref: URL_TIP_CLOSE}
  URL_LABEL:
    seq:
    - {ref: SPACE_ONE}
    - {regex: "[^\\s\_\\{\\}\\[\\]][^\\[\\]]*", ci: true, scope: string.other.link.description}
  URL_LINK:
    alt:
    - seq:  # [["quoted target"{tooltip} label]]
      - {ref: URL_OPEN}
      - {ref: SPACE_ANY}
      - {ref: URL_QUOTE_OPEN}
      - {regex: "[^\"“”]+", ci: true, scope: markup.underline.link}
      - {ref: URL_QUOTE_CLOSE}
      - opt: {ref: URL_TOOLTIP}
      - opt: {ref: URL_LABEL}
      - {ref: SPACE_ANY}
      - {ref: URL_CLOSE}
    - seq:  # [[{tooltip only}]]
      - {ref: URL_OPEN}
      - {ref: SPACE_ANY}
      - {ref: URL_TIP_OPEN}
      - {regex: '.*', ci: true, scope: string.quoted.other.tooltip}
      - {ref: URL_TIP_CLOSE}
      - {ref: SPACE_ANY}
      - {ref: URL_CLOSE}
    - seq:  # [[{tooltip} label]]
      - {ref: URL_OPEN}
      - {ref: SPACE_ANY}
      - {ref: URL_TIP_OPEN}
      - {regex: '[^{}]*', ci: true, scope: string.quoted.other.tooltip}
      - {ref: URL_TIP_CLOSE}
      - {ref: SPACE_ANY}
      - {regex: "[^\\[\\s\_\\{\\}\\[\\]][^\\[\\]]*", ci: true, scope: string.other.link.description}
      - {ref: SPACE_ANY}
      - {ref: URL_CLOSE}
    - seq:  # [[target {tooltip with braces}]]
      - {ref: URL_OPEN}
      - {ref: SPACE_ANY}
      - {regex: "[^\\s\"“”{}\\[\\]]+?", ci: true, scope: markup.underline.link}
      - {ref: SPACE_ANY}
      - {ref: URL_TIP_OPEN}
      - {regex: '.+', ci: true, scope: string.quoted.other.tooltip}
      - {ref: URL_TIP_CLOSE}
      - {ref: SPACE_ANY}
      - {ref: URL_CLOSE}
    - seq:  # [[target{tooltip} label]]
      - {ref: URL_OPEN}
      - {ref: SPACE_ANY}
      - {regex: "[^\\s\_\"“”\\[\\]]+?", ci: true, scope: markup.underline.link}
      - opt: {ref: URL_TOOLTIP}
      - opt: {ref: URL_LABEL}
      - {ref: SPACE_ANY}
      - {ref: URL_CLOSE}

  # --- visibility (skin/VisibilityModifier.java:211-235) ----------------------------
  VISIBILITY_KEYWORD:
    alt:
    - {literal: public, ci: true, scope: storage.modifier.visibility}
    - {literal: private, ci: true, scope: storage.modifier.visibility}
    - {literal: protected, ci: true, scope: storage.modifier.visibility}
    - {literal: package, ci: true, scope: storage.modifier.visibility}
  VISIBILITY_LIST:
    seq:
    - opt: {ref: VISIBILITY_KEYWORD}
    - star:
        seq: [{regex: "[,\\s\_]+", ci: true}, {ref: VISIBILITY_KEYWORD}]
  VISIBILITY_CHAR: {regex: '[-#+~]', ci: true, scope: storage.modifier.visibility}

  # --- arrow styles `[#red,dashed,thickness=2]` ---------------------------------
  ARROW_STYLE_OPEN: {literal: '[', ci: true, scope: punctuation.section.arrow-style.begin}
  ARROW_STYLE_CLOSE: {literal: ']', ci: true, scope: punctuation.section.arrow-style.end}
  ARROW_STYLE_ITEM:
    alt:
    - {ref: COLOR_REF}
    - {literal: dotted, ci: true, scope: support.constant.arrow-style}
    - {literal: dashed, ci: true, scope: support.constant.arrow-style}
    - {literal: plain, ci: true, scope: support.constant.arrow-style}
    - {literal: bold, ci: true, scope: support.constant.arrow-style}
    - {literal: hidden, ci: true, scope: support.constant.arrow-style}
    - {literal: norank, ci: true, scope: support.constant.arrow-style}
    - {literal: single, ci: true, scope: support.constant.arrow-style}
    - {literal: node, ci: true, scope: support.constant.arrow-style}
    - seq:
      - {literal: thickness, ci: true, scope: support.type.property-name}
      - {literal: '=', ci: true, scope: keyword.operator.assignment}
      - {regex: '\d+', ci: true, scope: constant.numeric.integer}
  ARROW_STYLE_ITEMS:
    seq:
    - {ref: ARROW_STYLE_ITEM}
    - star:
        seq:
        - {literal: ',', ci: true, scope: punctuation.separator.comma}
        - {ref: ARROW_STYLE_ITEM}
  ARROW_STYLE_SPEC:
    opt:
      seq: [{ref: ARROW_STYLE_OPEN}, {ref: ARROW_STYLE_ITEMS}, {ref: ARROW_STYLE_CLOSE}]
  ARROW_STYLE_MULTI:
    opt:
      seq:
      - {ref: ARROW_STYLE_OPEN}
      - {ref: ARROW_STYLE_ITEMS}
      - star:
          seq:
          - {literal: ;, ci: true, scope: punctuation.separator.style-group}
          - {ref: ARROW_STYLE_ITEMS}
      - {ref: ARROW_STYLE_CLOSE}

  # --- arrow heads and bodies (class diagram link, CommandLinkClass) -----------------
  ARROW_HEAD_LEFT: {regex: '(?:<\|:|<\|\||<\||\|\||<<|<_|\}o\b|\|o\b|0\)|\}\||@|#|\)|\*|\+|\bo\b|0|x|<|\}|\^)', ci: true, scope: keyword.operator.arrow.head}
  ARROW_HEAD_RIGHT: {regex: '(?::\|>|\|\|>|\|\||>>|\\\\|//|\|>|\(0|\bo\{|\bo\||\|\{|_>|@|#|\(|\*|\+|\bo\b|0|x|\{|\^|>)', ci: true, scope: keyword.operator.arrow.head}
  ARROW_BODY_LINE: {regex: '[-=.]+', ci: true, scope: keyword.operator.arrow.body}

  # --- stereotypes `<<label>>`, spot `<< (S,#FF7700) label >>` ------------------------
  # Spot syntax: stereo/StereotypeDecoration.java:59-74 (circleChar).
  STEREOTYPE_OPEN: {literal: '<<', ci: true, scope: punctuation.definition.stereotype.begin}
  STEREOTYPE_CLOSE: {literal: '>>', ci: true, scope: punctuation.definition.stereotype.end}
  STEREOTYPE_SPOT:
    seq:
    - {ref: SPACE_ANY}
    - {literal: (, ci: true, scope: punctuation.definition.spot.begin}
    - {regex: '\S', ci: true, scope: constant.character.spot}
    - opt:
        seq:
        - {ref: SPACE_ANY}
        - {literal: ',', ci: true, scope: punctuation.separator.comma}
        - {ref: SPACE_ANY}
        - alt:
          - seq: [{ref: COLOR_HASH}, {regex: '[0-9a-f]{6}', ci: true, scope: constant.other.color.rgb-value}]
          - {ref: COLOR_WORD}
        - {ref: SPACE_ANY}
    - {literal: ), ci: true, scope: punctuation.definition.spot.end}
  # A spot cannot contain `>>`, so trying the spot branch first never changes where
  # the lazy `.+?` would stop.
  STEREOTYPE_SPEC:
    seq:
    - {ref: STEREOTYPE_OPEN}
    - alt:
      - seq:
        - {ref: STEREOTYPE_SPOT}
        - {regex: '.*?', ci: true, scope: entity.other.attribute-name.stereotype}
      - {regex: '.+?', ci: true, scope: entity.other.attribute-name.stereotype}
    - {ref: STEREOTYPE_CLOSE}
  STEREOTYPE_ITEM:
    seq:
    - {ref: STEREOTYPE_OPEN}
    - {regex: '[^<>]+', ci: true, scope: entity.other.attribute-name.stereotype}
    - {ref: STEREOTYPE_CLOSE}
  STEREOTYPE_GROUP:
    seq:
    - {ref: STEREOTYPE_ITEM}
    - star:
        seq: [{ref: SPACE_ANY}, {ref: STEREOTYPE_ITEM}]
