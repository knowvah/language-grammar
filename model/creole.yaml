      - {regex: "[\\s\_].+", ci: true, scope: markup.list.unnumbered}
  # `# item` (CreoleStripeSimpleParser.java:71, :139-147).
  CREOLE_LIST_NUMBERED:
    seq:
    - {regex: '#+', ci: true, scope: punctuation.definition.list}
    - {regex: '.+', ci: true, scope: markup.list.numbered}
  # `= Title` .. `==== Title` (CreoleStripeSimpleParser.java:72, :149-155).
  CREOLE_HEADING:
    seq:
    - {regex: '=+', ci: true, scope: punctuation.definition.heading}
    - {regex: '.+', ci: true, scope: markup.heading}
