# Hand-written (T34). Citations at upstream 97a5992.
# D4 opaque body (math): the lines are not parsed. Refines embedded-math with the
# PSystemBasicFactory line accounting of single-line-basic. The body entry becomes a
# per-line `single` catch-all (the interpreter's `opaque` swallowed the rest of the block,
# so noise-only bodies were accepted; emitters already treat `opaque` as `single`). It
# matches only non-empty trimmed lines; "" lines are skipped and non-empty blank lines are
# basic_lead's.
schema_version: 1
id: single-line-math
layer: diagram
diagram: MATH
factory: PSystemMathFactory
include: [embedded-math, single-line-basic]
overrides:
  PSystemMathFactory:
    provenance: {class: net.sourceforge.plantuml.math.PSystemMathFactory, file: src/main/java/net/sourceforge/plantuml/math/PSystemMathFactory.java, line: 57, also: [src/main/java/net/sourceforge/plantuml/command/PSystemBasicFactory.java:94]}
    kind: single
    parts: {regex: "[\\s\\S]+"}
    gives: basic_line
contexts:
  main:
    - include: basic_lead
    - include: embedded-math#main
