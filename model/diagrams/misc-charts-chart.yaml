# Charts (T30, `@startchart`, ChartDiagramFactory). Upstream pin 97a5992; paths are
# relative to src/main/java/net/sourceforge/plantuml/.
#
# chart/ChartDiagramFactory.java:65-79: ten chart commands, then the common block. No final
# check (ChartDiagram keeps the core/AbstractDiagram.java:161-171 defaults).
#
# Execute-time errors with a syntactic cause (the rule is narrowed in place, then a reject
# of the upstream shape follows it): number formats, `spacing` > 0, tick lists, the
# annotation Y position and unknown series colors (misc-charts-chart-values,
# misc-charts-colors).
#
# Series format (chart/ChartDiagram.java:193-255). A coordinate series (line/scatter data
# with `(`) fails while the h-axis has no explicit range (autoScale, :209-212), and every
# series must use the format of the first one (:214-221, :236-243). States: `main` (no
# range, no series), `chart_range` (an h-axis range was set, no series), `chart_index` and
# `chart_coord` (the first series' format). Transitions are interpreter-only head entries
# (`emit: false`, rejects); chart commands come first upstream, so heads keep the order.
# Not modelled (gap fixtures): x outside the h-axis range and min == max (numeric, :209,
# :223-229), categorical h-axis labels set after the range (:203-206).
