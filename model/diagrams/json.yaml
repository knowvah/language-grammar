# `@startjson` diagrams (T29). Upstream pin 97a5992; paths are relative to
# src/main/java/net/sourceforge/plantuml/. Refines the T13 base `embedded-json`
# (its `main` and `empty` are shadowed here). `@startyaml`/`@starthcl` stay opaque (D4).
#
# Upstream. JsonDiagramFactory is a PSystemAbstractFactory, not a command factory
# (jsondiagram/JsonDiagramFactory.java:61), so `common` is not included.
# * StyleExtractor (jsondiagram/StyleExtractor.java:63-101) walks the preprocessed block,
#   @startjson and @endjson included, and keeps a list of "data" lines. Blank lines are
#   dropped (:66-68). A trimmed line equal to `<style>` (case-sensitive) starts a region
#   that runs to the first trimmed `</style>` line, in any state (:69-75, :105-111).
#   While the list holds only @startjson (the "header"), trimmed lines starting with
#   `!assume `, `!pragma `, `hide `, `scale `, `title `, `skin `, `skinparam ` are taken
#   out (:76-97); a `skinparam` line containing `{` swallows lines up to a trimmed `}`
#   line (:91-96). Every other line is added to the list as is, untrimmed (:98-99).
# * The factory (JsonDiagramFactory.java:73-96) skips the first list line, stops before
#   the last one (normally @endjson, :77-82), turns a line starting with `#highlight `
#   into a Highlighted (:83-87, yaml/Highlighted.java:64-76), drops any other `#` line,
#   and joins the rest with "\n" (:88-91, text/BackSlash.java:48) for Json.parse (:93).
# * JsonParser (json/JsonParser.java): RFC 8259 values with two leniencies only: a `//`
#   comment up to the end of the line is allowed inside an object before a member name
#   (:230-232) and after a member value (:245-247), and skipComment needs the second `/`
#   (:256-263). No block comments, no trailing commas (a name or value must follow `,`:
#   :202-208, :228-248, :265-270), keys and strings double-quoted only (:265-270,
#   :311-328), no control characters in strings (:319-320), escapes `\" \/ \\ \b \f \n \r
#   \t \uXXXX` (:330-368), case-sensitive `true`/`false`/`null` (:272-298), numbers
#   without `+` or leading zeros (:370-412), whitespace = space, tab, LF, CR (:501-503),
#   nesting at most 1000 (:39, :193-195, :219-221), and text after the value is
#   "Unexpected character" (:144-149). Every such error is a ParseException, and the
#   factory catches it (:94-96): the diagram then renders "Your data does not sound like
#   JSON data" (JsonDiagram.java:116-122). So the JSON text never decides acceptance
#   (oracle-verified: garbage, trailing commas, unquoted keys, single quotes, trailing
#   text, 5000-deep nesting are all accepted).
# * What the jar rejects: exceptions other than ParseException escape createSystem and
#   PSystemBuilder turns any Throwable into an error (PSystemBuilder.java:275-280),
#   reported at the @end line:
#   - NoSuchElementException (JsonDiagramFactory.java:79): a header `<style>` or
#     `skinparam ... {` region that never closes swallows @endjson, leaving only
#     @startjson in the list. After a content line the same region only swallows the
#     last list line, which is harmless.
#   - IllegalStateException from Highlighted.build (Highlighted.java:69-71): after
#     `#highlight `, the trimmed rest must match `^([^<>]+)(<<.*>>)?$` (:50).
#   - IllegalStateException / NullPointerException from StyleParser (style/parser/
#     StyleParser.java:104-113, :116, :121, :153-172) on the style regions. A
#     StyleParsingException (:141, :170, :213, :215, `skin` loading) is caught and only
#     logged (JsonDiagramFactory.java:99-104), so such bodies are accepted.
#
# Model. `main` is the header state, `json_content` the state after the first list line
# (`set`). Failures use `needs: json_throws`, a flag no entry gives, so the attempt fails
# at the @end line exactly like the jar; those entries are `emit: false` (emitters see
# only the accepting entries). The JSON lines themselves always pass: `JsonMemberLine`,
# `JsonCommentLine` and `JsonText` give emitters line-level structure only. The class
# family's JSON grammar (class-objects CO_JSON_*) is not reused: it reads joined lines as
# concatenated with nothing between them (CommandCreateJson) and never allows `//`, while
# here lines are joined with "\n", and acceptance does not depend on it anyway.
# * Style regions (grammar in `json-style`): `JsonStyleError` is a `join` over exactly
#   one closed region (its last joined line is the first `</style>`, so `style`'s
#   END-line conventions hold) whose
#   parts are the valid StyleParser statements of `style` (STYLE_STATEMENT, T33) followed
#   by the first statement that throws IllegalStateException or reads a missing token
#   (an unclosed `/*`, `/'`, quote or `@` token swallows `</style>` and the last newline;
#   a `//` comment leaves `</style>` as the next STRING). Fuzzed against the jar: 1,800
#   random regions, no disagreement outside the gaps below. `JsonStyle` (header) pushes
#   the region with `require_pop`, so an unclosed one backtracks to `JsonStyleUnclosed`.
#   After content, `JsonStyleContent` pushes without `require_pop`. `JsonStyleStructure`
#   is the emitter view (multiline + end + push of style's `style_body`, as T33
#   recommends); the interpreter never reaches it.
# * `skinparam ... {` in the header: the same push / require_pop / unclosed pattern; the
#   push is emitted too, and its body line never matches a lone `}`, so Lark cannot run a
#   block past its first `}` (a multiline rendering did, into theme `<style>` regions).
# * `JsonText` in `main` (the first data line) excludes the header keywords, so Lark has
#   one header/content split; the interpreter takes those lines earlier anyway.
# Known gaps (fixtures in tests/fixtures/json/gap):
# * Unclosed `<style>` after content: StyleParser still runs on the rest of the block,
#   but a join cannot see the end of the body, so its errors are accepted here.
# * A `{{` line inside a style region: the interpreter glues `{{ ... }}` units in every
#   join (tools/interp/scan.py unit_end, a command-factory rule), so the error join
#   cannot end at `</style>` and the region is accepted.
# * All style regions of a block form one StyleParser run (StyleExtractor.java:133-137):
#   here each region is checked alone, so a StyleParsingException in an earlier region
#   that hides a later IllegalStateException is rejected here; a statement spanning two
#   regions is not modelled.
# * An unclosed `<style>` after content also drops the last list line, so a bad
#   `#highlight` right before it is never built (accepted upstream, rejected here).
schema_version: 1
id: json
layer: diagram
diagram: JSON
factory: JsonDiagramFactory
include: [embedded-json, json-style]

variables:
  JSON_ANY: {regex: ".*"}
  # A Java String.trim() blank inside one line (chars <= U+0020 except line breaks).
  JSON_BLANKS: {regex: "[\\x00-\\x09\\x0b\\x0c\\x0e-\\x20]*"}
  # ---- header lines (StyleExtractor.java:76-97) ----
  JSON_SKINPARAM_KEYWORD: {literal: "skinparam ", ci: false, scope: keyword.other.skinparam.json}
  JSON_SKINPARAM_BLOCK:
    seq:
      - {ref: JSON_SKINPARAM_KEYWORD}
      - {regex: "[^{\\n\\r]*", scope: variable.parameter.skinparam.json}
      - {literal: "{", ci: false, scope: punctuation.section.block.begin.json}
      - {ref: JSON_ANY}
  JSON_BLOCK_CLOSE: {literal: "}", ci: false, scope: punctuation.section.block.end.json}
  # A body line other than the closing `}` (that one always pops first). Excluding it
  # keeps Lark from running a block past its first `}` (upstream stops there, :93-94).
  JSON_SKINPARAM_LINE:
    seq:
      - {regex: "(?!\\}[ \\t]*(?:\\r?\\n|$))[^\\s]+", scope: support.type.property-name.skinparam.json}
      - {regex: "[^\\n\\r]*", scope: string.unquoted.skinparam.json}
  # ---- data lines (JsonDiagramFactory.java:83-91) ----
  JSON_HIGHLIGHT_KEYWORD: {literal: "#highlight ", ci: false, scope: keyword.other.highlight.json}
  # Highlighted.java:67-71: the trimmed rest matches ^([^<>]+)(<<.*>>)?$ (Java `.`
  # excludes the line terminators \n \r U+0085 U+2028 U+2029).
  JSON_HIGHLIGHT_LINE:
    seq:
      - {ref: JSON_HIGHLIGHT_KEYWORD}
      - {ref: JSON_BLANKS}
      - {regex: "(?=[^\\x00-\\x20])[^<>\\n\\r]+", scope: string.unquoted.path.json}
      - opt: {regex: "<<[^\\n\\r\u0085  ]*>>", scope: entity.name.type.stereotype.json}
      - {ref: JSON_BLANKS}
  JSON_HIGHLIGHT_ANY:
    seq: [{ref: JSON_HIGHLIGHT_KEYWORD}, {ref: JSON_ANY}]
  JSON_HASH_LINE: {regex: "#.*", scope: comment.line.number-sign.json}
  JSON_LINE_COMMENT: {regex: "//.*", scope: comment.line.double-slash.json}
  # JsonParser.java:265-270 (name), :311-328 (string), :237 (`:`).
  JSON_MEMBER:
    seq:
      - {regex: "\"(?:[^\"\\\\\\x00-\\x1f]|\\\\.)*\"", scope: support.type.property-name.json}
      - {regex: "[ \\t]*"}
      - {literal: ":", ci: false, scope: punctuation.separator.dictionary.key-value.json}
      - {regex: ".*", scope: meta.structure.dictionary.value.json}
  JSON_TEXT: {regex: ".+", scope: meta.structure.json}
  # The first data line ends the header (StyleExtractor.java:98-99). It is never a line
  # the header entries always take; excluding them keeps the header/content split
  # unambiguous for Lark (the interpreter reaches this entry only after them anyway).
  JSON_TEXT_FIRST: {regex: "(?!(?:!assume |!pragma |hide |scale |title |skin |skinparam |<style>[ \\t]*(?:\\r?\\n|$)))[^\\n\\r]+", scope: meta.structure.json}

