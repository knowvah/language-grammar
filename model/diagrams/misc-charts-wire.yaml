# Wire diagrams (T30, `@startwire`, WireDiagramFactory). Upstream pin 97a5992; paths are
# relative to src/main/java/net/sourceforge/plantuml/.
#
# wire/WireDiagramFactory.java:56-65: the common block, then seven wire commands. No final
# check (WireDiagram keeps the core/AbstractDiagram.java:161-171 defaults).
#
# Depth. Components nest by indentation: a command at level k walks k times to the last
# child (wire/WBlock.java:161-219) and getLastChild returns null when there is none
# (:230-235), so the next call throws NullPointerException, an execution error
# (command/ProtectedCommand.java:65-76). With D = the length of the last-child chain, a
# component at level k <= D sets D = k + 1, and goto/move/`--`/print need k <= D. The
# contexts track D exactly up to 4 (`main` is D = 0, `wire_dK` is D = K) and leniently
# beyond (`wire_deep`); levels are lookaheads in misc-charts-wire-parts. The state heads are
# interpreter-only (`emit: false`, rejects): the emitters keep the generated rules.
#
# Execute-time errors with a syntactic cause (narrowed rule, then a reject of the upstream
# shape): unknown colors in component, spot and link (misc-charts-colors) and
# Integer.parseInt overflow of a component size (CommandComponent.java:96-99).
# Not modelled (name tables, gap fixtures): "Component exists already" for a name already
# used by a sibling or by a node on the path (WBlock.java:203-205), "No such element" for a
# spot or link whose (dotted) name is unknown (WireDiagram.java:110-118, :142-176).
