      provenance:
        class: net.sourceforge.plantuml.cheneer.command.CommandMultiSubclass
        file: src/main/java/net/sourceforge/plantuml/cheneer/command/CommandMultiSubclass.java
        line: 114
        engine: IRegex
      kind: single
      emit: false
      parts:
        seq: [{ref: CE_MULTI_SUBCLASS_HEAD}, {ref: MC_COLORS_OK}]
    - command: ChenMultiSubclassFails
      provenance:
