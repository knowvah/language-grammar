    - command: ChenSimpleSubclassFails
      provenance:
        class: net.sourceforge.plantuml.cheneer.command.CommandSimpleSubclass
        file: src/main/java/net/sourceforge/plantuml/cheneer/command/CommandSimpleSubclass.java
        line: 122
