# Color checks shared by the mindmap and WBS models (T26). Upstream pin 97a5992; paths
# are relative to src/main/java/net/sourceforge/plantuml/.
#
# A node color `[#name]` or a link color `#name` is parsed by
# klimt/color/HColorSet.getColor (:69-76), which throws NoSuchColorException when
# parseColor returns null; SingleLineCommand2.execute and CommandMultilines2.execute turn
# that into an execution error (command/SingleLineCommand2.java:176-177,
# command/CommandMultilines2.java:119-120), so the factory fails
# (command/PSystemCommandFactory.java:180-187). parseColor (HColorSet.java:78-120) knows:
# * transparent, background and automatic, ignoring case (:82-89);
# * hex with 1, 3, 6 or 8 digits (:122-156);
# * the named colors of klimt/color/ColorTrieNode.java:55-209, looked up ignoring ASCII
#   case (:212-223); the alternation below lists them in registration order and must
#   stay equal to COLOR_NAME in model/shared.yaml;
# * a gradient `a<sep>b` with `-`, `\`, `|` or `/` when both halves are simple
#   colors (:109-117). Only link colors can contain a separator (the node regex is
#   `\[(#\w+)\]`).
# The variables are zero-width lookaheads for `reject` entries, which the emitters drop.
schema_version: 1
id: mindmap-wbs-colors
layer: shared

variables:
  # At a node color `[#...]` after the `#`: the bracket does not hold exactly one
  # known color word followed by `]`.
  MW_BRACKET_COLOR_UNKNOWN:
    regex: '(?!(?:transparent|background|automatic|[0-9a-f]{8}|[0-9a-f]{6}|[0-9a-f]{3}|[0-9a-f]|AliceBlue|AntiqueWhite|Aqua|Aquamarine|Azure|Beige|Bisque|Black|BlanchedAlmond|Blue|BlueViolet|Brown|BurlyWood|CadetBlue|Chartreuse|Chocolate|Coral|CornflowerBlue|Cornsilk|Crimson|Cyan|DarkBlue|DarkCyan|DarkGoldenRod|DarkGray|DarkGrey|DarkGreen|DarkKhaki|DarkMagenta|DarkOliveGreen|Darkorange|DarkOrchid|DarkRed|DarkSalmon|DarkSeaGreen|DarkSlateBlue|DarkSlateGray|DarkSlateGrey|DarkTurquoise|DarkViolet|DeepPink|DeepSkyBlue|DimGray|DimGrey|DodgerBlue|FireBrick|FloralWhite|ForestGreen|Fuchsia|Gainsboro|GhostWhite|Gold|GoldenRod|Gray|Grey|Green|GreenYellow|HoneyDew|HotPink|IndianRed|Indigo|Ivory|Khaki|Lavender|LavenderBlush|LawnGreen|LemonChiffon|LightBlue|LightCoral|LightCyan|LightGoldenRodYellow|LightGray|LightGrey|LightGreen|LightPink|LightSalmon|LightSeaGreen|LightSkyBlue|LightSlateGray|LightSlateGrey|LightSteelBlue|LightYellow|Lime|LimeGreen|Linen|Magenta|Maroon|MediumAquaMarine|MediumBlue|MediumOrchid|MediumPurple|MediumSeaGreen|MediumSlateBlue|MediumSpringGreen|MediumTurquoise|MediumVioletRed|MidnightBlue|MintCream|MistyRose|Moccasin|NavajoWhite|Navy|OldLace|Olive|OliveDrab|Orange|OrangeRed|Orchid|PaleGoldenRod|PaleGreen|PaleTurquoise|PaleVioletRed|PapayaWhip|PeachPuff|Peru|Pink|Plum|PowderBlue|Purple|Red|RosyBrown|RoyalBlue|SaddleBrown|Salmon|SandyBrown|SeaGreen|SeaShell|Sienna|Silver|SkyBlue|SlateBlue|SlateGray|SlateGrey|Snow|SpringGreen|SteelBlue|Tan|Teal|Thistle|Tomato|Turquoise|Violet|Wheat|White|WhiteSmoke|Yellow|YellowGreen|BUSINESS|APPLICATION|MOTIVATION|STRATEGY|TECHNOLOGY|PHYSICAL|IMPLEMENTATION)\])'
    ci: true
  # At a link color after the `#`: the run of word and separator characters is not a
  # known color or a gradient of two known colors (`\w` here is wider than Java's ASCII
  # `\w`, so a non-ASCII letter ends no run: upstream rejects such a line anyway).
  MW_LINK_COLOR_UNKNOWN:
    regex: '(?!(?:transparent|background|automatic|[0-9a-f]{8}|[0-9a-f]{6}|[0-9a-f]{3}|[0-9a-f]|AliceBlue|AntiqueWhite|Aqua|Aquamarine|Azure|Beige|Bisque|Black|BlanchedAlmond|Blue|BlueViolet|Brown|BurlyWood|CadetBlue|Chartreuse|Chocolate|Coral|CornflowerBlue|Cornsilk|Crimson|Cyan|DarkBlue|DarkCyan|DarkGoldenRod|DarkGray|DarkGrey|DarkGreen|DarkKhaki|DarkMagenta|DarkOliveGreen|Darkorange|DarkOrchid|DarkRed|DarkSalmon|DarkSeaGreen|DarkSlateBlue|DarkSlateGray|DarkSlateGrey|DarkTurquoise|DarkViolet|DeepPink|DeepSkyBlue|DimGray|DimGrey|DodgerBlue|FireBrick|FloralWhite|ForestGreen|Fuchsia|Gainsboro|GhostWhite|Gold|GoldenRod|Gray|Grey|Green|GreenYellow|HoneyDew|HotPink|IndianRed|Indigo|Ivory|Khaki|Lavender|LavenderBlush|LawnGreen|LemonChiffon|LightBlue|LightCoral|LightCyan|LightGoldenRodYellow|LightGray|LightGrey|LightGreen|LightPink|LightSalmon|LightSeaGreen|LightSkyBlue|LightSlateGray|LightSlateGrey|LightSteelBlue|LightYellow|Lime|LimeGreen|Linen|Magenta|Maroon|MediumAquaMarine|MediumBlue|MediumOrchid|MediumPurple|MediumSeaGreen|MediumSlateBlue|MediumSpringGreen|MediumTurquoise|MediumVioletRed|MidnightBlue|MintCream|MistyRose|Moccasin|NavajoWhite|Navy|OldLace|Olive|OliveDrab|Orange|OrangeRed|Orchid|PaleGoldenRod|PaleGreen|PaleTurquoise|PaleVioletRed|PapayaWhip|PeachPuff|Peru|Pink|Plum|PowderBlue|Purple|Red|RosyBrown|RoyalBlue|SaddleBrown|Salmon|SandyBrown|SeaGreen|SeaShell|Sienna|Silver|SkyBlue|SlateBlue|SlateGray|SlateGrey|Snow|SpringGreen|SteelBlue|Tan|Teal|Thistle|Tomato|Turquoise|Violet|Wheat|White|WhiteSmoke|Yellow|YellowGreen|BUSINESS|APPLICATION|MOTIVATION|STRATEGY|TECHNOLOGY|PHYSICAL|IMPLEMENTATION)(?:[-\\|/](?:transparent|background|automatic|[0-9a-f]{8}|[0-9a-f]{6}|[0-9a-f]{3}|[0-9a-f]|AliceBlue|AntiqueWhite|Aqua|Aquamarine|Azure|Beige|Bisque|Black|BlanchedAlmond|Blue|BlueViolet|Brown|BurlyWood|CadetBlue|Chartreuse|Chocolate|Coral|CornflowerBlue|Cornsilk|Crimson|Cyan|DarkBlue|DarkCyan|DarkGoldenRod|DarkGray|DarkGrey|DarkGreen|DarkKhaki|DarkMagenta|DarkOliveGreen