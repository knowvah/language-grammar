# Gantt sentence grammar (T25): the 9 NaturalGanttCommand subjects, included by `gantt`.
# Upstream pin 97a5992; paths are relative to src/main/java/net/sourceforge/plantuml/.
#
# Upstream. GanttDiagramFactory registers one NaturalGanttCommand per subject between the
# common block and CommandGanttArrow (gantt/GanttDiagramFactory.java:89, :112-122). Each
# reads `SP? SUBJECT SP? PHRASE (AND PHRASE)* <rest>` (gantt-sentences-phrases), using the
# generated `gantt-lang` shapes. Per subject, in that order:
# * `NaturalGantt<S>Invalid` (reject): the sentence reaches a field whose parse fails
#   (gantt-sentences-bad); the generated shapes are supersets, so these come first.
# * `NaturalGantt<S>` (accept): the sentence, emitted to every grammar.
# * `NaturalGantt<S>Unmatched` (reject): the isValid shape (subject and one phrase
#   prefix, NaturalGanttCommand.java:125-144). The command owns the line, so whatever the
#   accept entry refused (no phrase after ` and `, "No matching verb phrase", :120) fails
#   here instead of reaching a later command.
# Emitters drop the rejects and keep the shape-level sentences: they accept invalid dates
# and numbers (the validated forms are too large for one PCRE2 regex).
#
# State, through the T24 hook (heads keyed by gantt.yaml's head ids):
# * main (no task-like entry yet): a task sentence creates its task (SubjectTask.getMe ->
#   GanttDiagram.getOrCreateTask, SubjectTask.java:442-461) and `set`s gantt_tasks; `it`
#   fails, nothing has set it yet (SubjectTask.java:444-447).
# * gantt_tasks, gantt_group_1, gantt_group: `project starts` fails, "Starting point must
#   be set before task definition" (gantt/GanttDiagram.java:340-346).
# * flags: an absolute `starts`/`ends` needs `project_start` ("No starting date for the
#   project", SubjectTask.java:106-107; `project starts` is only legal before any task, so
#   order-free is exact), which `project starts` gives; task sentences give `real_task`
#   (gantt.yaml final check).
# Gaps (reports/classify/gantt.yaml): task and day-name lookups; `it`/`they` after other
# entries; working hours that parse to null; the 20-year limit (GanttDiagram.java:175-176).
schema_version: 1
id: gantt-sentences
layer: shared
include: [gantt-sentences-phrases, gantt-sentences-bad, gantt-lang]

