# Hand-written (T34). Citations at upstream 97a5992.
# The line is matched untrimmed (PSystemSingleLineFactory.java:91-95).
# Pattern2 `^sudoku(?:[%s]+([0-9a-zA-Z]+))?[%s]*$` (ASCII case folding, %s = \s +
# NBSP) with find() (:53-54): `$` also matches before a final U+0085/U+2028/U+2029.
# Long.parseLong(seed, 36) (:60) throws above Long.MAX_VALUE (1y2p0ij32e8e7), which
# PSystemBuilder.java:275-280 reports as a crash, so the seed is bounded.
schema_version: 1
id: single-line-sudoku
layer: diagram
diagram: SEQUENCE
factory: PSystemSudokuFactory
include: [gen-psystem-sudoku, single-line-base]
overrides:
  PSystemSudokuFactory:
    provenance: {class: net.sourceforge.plantuml.sudoku.PSystemSudokuFactory, file: src/main/java/net/sourceforge/plantuml/sudoku/PSystemSudokuFactory.java, line: 49, also: [src/main/java/net/sourceforge/plantuml/sudoku/PSystemSudokuFactory.java:53-60, src/main/java/net/sourceforge/plantuml/regex/Pattern2.java:57, src/main/java/net/sourceforge/plantuml/command/PSystemSingleLineFactory.java:91-95]}
    kind: single
