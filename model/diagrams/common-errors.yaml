# Execution errors of the common commands (T16), included by `common`. Upstream pin
# 97a5992; paths are relative to src/main/java/net/sourceforge/plantuml/.
#
# `common` narrows each refined command to the lines its execute step accepts. Upstream,
# though, the unnarrowed regex matches first and the execute step then fails the factory
# (CommandExecutionResult.error -> EXECUTION_ERROR, command/PSystemCommandFactory.java:
# 180-187), or throws (NumberFormatException, NullPointerException), so no later command
# sees the line. Each entry below is therefore a `reject` with the generated (unnarrowed)
# shape, inserted right after the narrowed rule: valid lines are taken by the rule, every
# other line of the same shape fails here instead of falling through to a later command
# (salt's catch-all CommandAnything, salt/CommandAnything.java:54). Emitters drop `reject`
# entries and keep the narrowed rule.
schema_version: 1
id: common-errors
layer: shared
include: [shared]

variables:
  NUMBER_RUN: {regex: "[0-9]+", ci: true, scope: constant.numeric.integer}
  DECIMAL_RUN: {regex: "[0-9.]+", ci: true, scope: constant.numeric.float}
  SCALE_WORD: {literal: scale, ci: true, scope: keyword.other.scale}
  MAX_WORD: {literal: max, ci: true, scope: keyword.other.scale}
  TIMES: {regex: "[*x]", ci: true, scope: punctuation.separator.dimensions}
  SPRITE_SHAPE_HEAD:
    seq:
      - {literal: sprite, ci: true, scope: keyword.other.sprite}
      - {ref: SPACE_SOME}
      - {regex: "\\$?", ci: true, scope: punctuation.definition.variable}
      - {regex: "[-.\\p{L}\\p{N}_]+", ci: true, scope: entity.name.constant.sprite}
      - {ref: SPACE_ANY}

insert_after:
  # CommonCommands.java:64.
  CommandPragma:
    - command: CommandPragmaError
      provenance:
        class: net.sourceforge.plantuml.command.CommandPragma
        file: src/main/java/net/sourceforge/plantuml/command/CommandPragma.java
        line: 120
        engine: IRegex
        also:
          - src/main/java/net/sourceforge/plantuml/command/CommandPragma.java:60-68
          - src/main/java/net/sourceforge/plantuml/command/CommandPragma.java:107
          - src/main/java/net/sourceforge/plantuml/command/CommandPragma.java:116
          - src/main/java/net/sourceforge/plantuml/command/CommonCommands.java:64
      kind: single
      reject: true
      parts:
        seq:
          - {literal: "!pragma", ci: true, scope: keyword.control.directive.pragma}
          - {ref: SPACE_SOME}
          - {regex: "[A-Za-z_][A-Za-z_0-9]*", ci: true, scope: entity.name.pragma}
          - opt:
              seq:
                - {ref: SPACE_SOME}
                - {regex: ".*", ci: true, scope: string.unquoted.pragma-value}
  # CommonCommands.java:68. A folded group the delegate cannot execute.
  CommandSkinParamJaws:
    - command: CommandSkinParamJawsError
      provenance:
        class: net.sourceforge.plantuml.command.CommandSkinParamJaws
        file: src/main/java/net/sourceforge/plantuml/command/CommandSkinParamJaws.java
        line: 101
        engine: IRegex
        also:
          - src/main/java/net/sourceforge/plantuml/command/CommandSkinParamJaws.java:58-63
          - src/main/java/net/sourceforge/plantuml/command/SkinLoader.java:94-96
          - src/main/java/net/sourceforge/plantuml/command/CommonCommands.java:68
      kind: single
      reject: true
      parts: {regex: "(?:(?:skinparam|skinparamlocked)[\\s\_]+.*\uE100.*)+", ci: true}
  # CommonCommands.java:72.
  CommandMinwidth:
    - command: CommandMinwidthError
      provenance:
        class: net.sourceforge.plantuml.command.CommandMinwidth
        file: src/main/java/net/sourceforge/plantuml/command/CommandMinwidth.java
        line: 74
