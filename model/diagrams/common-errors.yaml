      kind: single
      reject: true
      parts:
        seq:
          - {literal: minwidth, ci: true, scope: keyword.other.minwidth}
          - {ref: SPACE_SOME}
          - {ref: NUMBER_RUN}
  # CommonCommands.java:73.
  CommandPage:
    - command: CommandPageError
      provenance:
        class: net.sourceforge.plantuml.command.CommandPage
        file: src/main/java/net/sourceforge/plantuml/command/CommandPage.java
        line: 90
        engine: IRegex
        also:
          - src/main/java/net/sourceforge/plantuml/command/CommandPage.java:87-88
          - src/main/java/net/sourceforge/plantuml/command/CommonCommands.java:73
      kind: single
      reject: true
