          - opt: {regex: "\\[[0-9]+x[0-9]+/(?:[0-9]+z|color)\\]", ci: true}
          - {ref: SPACE_SOME}
          - {regex: "[-_A-Za-z0-9]+", ci: true, scope: string.unquoted.sprite-data}
  # CommonCommands.java:98.
  CommandScale:
