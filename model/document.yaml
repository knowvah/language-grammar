# Hand-written (T13). L0 document layer: how a file splits into @startX ... @endX blocks
# and which factories each start keyword is offered to. Citations at upstream 97a5992.
#
# Blocks (BlockUmlBuilder.java:100-135): a start directive (StartUtils.isStartDirective,
# utils/StartUtils.java:51-63: optional whitespace, '@' or '\', the case-sensitive word
# "start", at least one more character) opens a block and discards an unterminated one
# (:101-104, hence `set` in block contexts); the first end directive
# (StartUtils.isEndDirective, :119-121: '@' or '\' then "end", any suffix) closes it
# (:126-135), so @startuml ... @endmindmap is one block. Text outside blocks is ignored
# (:113: lines are kept only while a block is open). @pause/@unpause/!exit (:105-125) are
# not modelled.
#
# Keyword: DiagramType.findStartTypes (core/DiagramType.java:69-92) reads the word after
# "start" case-insensitively and by PREFIX (:220-232): @startumlfoo is uml. The rest of
# the line is a free-form name (@startuml foo, @startuml(id=x); StartUtils.java:45-46).
# The 30 directive pairs are LanguageDescriptor.java:56-85; any other word still opens a
# block (StartOther) whose diagram is PSystemUnsupported (error/PSystemErrorUtils.java:58-59).
#
# start_map: keyword -> factories tried, in PSystemBuilder.java:133-200 order, keeping
# those whose DiagramType (constructor super(DiagramType.X); single-line factories via
# command/PSystemSingleLineFactory.java:60) is in the keyword's type set
# (DiagramType.java:94-218). chronology and jcckit have no registered factory
# (PSystemBuilder.java:162,184 are commented out) so they are absent: upstream answers
# PSystemUnsupported (PSystemBuilder.java:283-284). PSystemPathFactory is registered only
# under SecurityProfile INSECURE (PSystemBuilder.java:178-179); the default is LEGACY
# (security/SecurityProfile.java:134), so it is omitted.
#
# D4 opaque bodies (dot, ditaa, math, latex, yaml, hcl) enter embed_<kw> contexts: the
# body is handed to the factory unparsed.
schema_version: 1
id: document
layer: document
start_map:
  bpm: [BpmDiagramFactory]
  board: [BoardDiagramFactory]
  chart: [ChartDiagramFactory]
  creole: [PSystemCreoleFactory]
  chen: [ChenEerDiagramFactory]
  crash: [CrashDiagramFactory]
  dot: [PSystemDotFactory]
  ditaa: [PSystemDitaaFactory]
  def: [PSystemDefinitionFactory]
  ebnf: [PSystemEbnfFactory]
  flow: [FlowDiagramFactory]
  files: [FilesDiagramFactory]
  gantt: [GanttDiagramFactory]
  git: [GitDiagramFactory]
  hcl: [HclDiagramFactory]
  json: [JsonDiagramFactory]
  latex: [PSystemLatexFactory]
  math: [PSystemMathFactory]
  mindmap: [MindMapDiagramFactory]
  nwdiag: [NwDiagramFactory]
  project: [GanttDiagramFactory]
  packetdiag: [PacketDiagramFactory]
  regex: [PSystemRegexFactory]
  salt: [PSystemSaltFactory]
  sprites: [ListSpriteDiagramFactory]
  uml: [PSystemWelcomeFactory, PSystemColorsFactory, SequenceDiagramFactory, ClassDiagramFactory, ActivityDiagramFactory, DescriptionDiagramFactory, StateDiagramFactory, ActivityDiagramFactory3, PSystemLicenseFactory, PSystemVersionFactory, PSystemDonorsFactory, PSystemSkinparameterListFactory, PSystemListFontsFactory, PSystemListEmojiFactory, PSystemOpenIconicFactory, PSystemListOpenIconicFactory, PSystemListArchimateSpritesFactory, PSystemSudokuFactory, ListSpriteDiagramFactory, PSystemEggFactory, PSystemAppleTwoFactory, PSystemRIPFactory, PSystemCharlieFactory, PSystemDedicationFactory, TimingDiagramFactory, HelpFactory]
  wire: [WireDiagramFactory]
  wbs: [WBSDiagramFactory]
  yaml: [YamlDiagramFactory]
variables:
