      provenance: {class: net.sourceforge.plantuml.donors.PSystemDonorsFactory, file: src/main/java/net/sourceforge/plantuml/donors/PSystemDonorsFactory.java, line: 49}
      kind: single
      parts: {regex: "donors\\s*", ci: true}
      set: done
