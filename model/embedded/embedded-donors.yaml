# line after the accepted line is rejected upstream but skipped here.

schema_version: 1
id: embedded-donors
layer: diagram
diagram: SEQUENCE
factory: PSystemDonorsFactory
include: [embedded-single-line]
contexts:
  main:
    - include: noise
