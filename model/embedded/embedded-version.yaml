# Hand-written (T13). Citations at upstream 97a5992.
# PSystemSingleLineFactory.createSystem (command/PSystemSingleLineFactory.java:69-103):
# leading noise lines are dropped (core/UmlSource.java:79-106), then the block must be
# exactly start line + ONE line + end line (:75-76) and executeLine must accept it (:95).
# Known gap: rules see trimmed lines, upstream matches the raw line; a trailing blank
# line after the accepted line is rejected upstream but skipped here.

schema_version: 1
id: embedded-version
layer: diagram
diagram: SEQUENCE
factory: PSystemVersionFactory
include: [embedded-single-line]
contexts:
  main:
    - include: noise
    - command: PSystemVersionFactory
      provenance: {class: net.sourceforge.plantuml.version.PSystemVersionFactory, file: src/main/java/net/sourceforge/plantuml/version/PSystemVersionFactory.java, line: 52}
      kind: single
      parts: {regex: "(?:authors?|about|version|stdlib|testdot|keydistributor|keygen|keyimport(?:\\s+[0-9a-z]+)?|keycheck\\s+[0-9a-z]+\\s+[0-9a-z]+)\\s*", ci: true}
      set: done
